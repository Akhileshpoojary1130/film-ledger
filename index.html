<title>Iris — your film diary</title>
<meta name="description" content="Iris: track the films and shows you watch, year by year. Ratings, watchlist, diary, stats and what to watch next.">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0B'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23D6A75D' stroke-width='3'/%3E%3C/svg%3E">
<script>
  /* Apply the saved theme before first paint so there's no flash. theme.js takes over once loaded. */
  (function () {
    try {
      var a = (JSON.parse(localStorage.getItem("film_ledger_prefs_v4") || "{}").appearance) || {};
      var r = document.documentElement;
      var m = a.mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : a.mode === "light" ? "light" : "dark";
      r.dataset.theme = a.theme || "cinema";
      r.dataset.mode = m;
      if (a.accent) r.style.setProperty("--accent", a.accent);
    } catch (e) {}
  })();
</script>
